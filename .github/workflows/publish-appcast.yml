name: Publish update feed

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and check the latest stable feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir public
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          python3 - <<'PY'
          import json, os, subprocess
          release = json.load(open('release.json'))
          if release['draft'] or release['prerelease']:
              raise SystemExit('Refusing to publish an unpublished or prerelease feed.')
          tag = release['tag_name']
          zips = [a for a in release['assets'] if a['name'].endswith('-macOS-arm64.zip')]
          feeds = [a for a in release['assets'] if a['name'] == 'appcast.xml']
          if len(zips) != 1 or len(feeds) != 1:
              raise SystemExit('Release must have one update ZIP and appcast.xml.')
          subprocess.run(['gh', 'release', 'download', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
                          '--pattern', 'appcast.xml', '--dir', 'public'], check=True)
          subprocess.run(['python3', 'scripts/validate-appcast.py', 'public/appcast.xml',
                          os.environ['GITHUB_REPOSITORY'], tag, zips[0]['name'], str(zips[0]['size'])],
                          check=True, stdout=subprocess.DEVNULL)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
